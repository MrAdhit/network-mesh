name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure is worth more than the noise it adds.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The control plane serves these to users, who pipe them into a shell. A syntax error in
      # one is a broken install rather than a broken developer script, and nothing else here
      # would catch it.
      - name: Check the install scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          sh -n packaging/install.sh
          sh -n packaging/uninstall.sh
          shellcheck -s sh packaging/install.sh packaging/uninstall.sh packaging/nfpm/*.sh

  # The same matrix a release is cut from, so nothing is built for the first time on a tag.
  build:
    uses: ./.github/workflows/build.yml
