name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure is worth more than the noise it adds.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # What the containers and most servers run.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            packages: -p meshcp -p meshd -p meshctl
          # Apple Silicon dev machines run arm64 containers, and small cloud
          # instances are increasingly arm64 too.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            packages: -p meshcp -p meshd -p meshctl
          # macOS gets the node and the CLI only. The control plane is a server
          # and has no reason to run on a laptop. Apple Silicon only: Intel Macs
          # are not a target, and the macos-13 runners they need queue for ages.
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            packages: -p meshd -p meshctl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # aws-lc-rs (via rustls) and libsqlite3-sys both build C, so a cross build
      # needs a cross compiler and cmake, not just a Rust target.
      - name: Install cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - run: cargo build --release ${{ matrix.packages }} --target ${{ matrix.target }}

      - name: Collect binaries
        run: |
          mkdir -p dist
          # Derive the binary list from the packages this target actually builds, so the
          # macOS legs cannot silently start expecting a control-plane binary.
          for pkg in ${{ matrix.packages }}; do
            case "$pkg" in -p) continue ;; esac
            cp "target/${{ matrix.target }}/release/$pkg" dist/
          done
          # Stripped separately so a failure here is visible rather than silent.
          if [ "${{ matrix.cross }}" = "true" ]; then
            aarch64-linux-gnu-strip dist/* || true
          else
            strip dist/* || true
          fi
          ls -la dist
          # Prove the artifacts are for the architecture the job claims.
          file dist/meshd

      - uses: actions/upload-artifact@v4
        with:
          name: mesh-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
