[package]
name = "meshctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mesh-core = { path = "../mesh-core" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2", "charset"] }
# Reads a password without echoing it. Passing one as an argument puts it in shell history
# and in `ps` output, so the prompt is the default path and the argument is the fallback.
rpassword = "7"
