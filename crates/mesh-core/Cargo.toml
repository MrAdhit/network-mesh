[package]
name = "mesh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2", "charset"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", features = ["pem", "crypto"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
base64 = "0.23"
rand = "0.10"
bytes = "1"
hex = "0.4"
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core"] }
if-addrs = "0.15"
ipnet = "2"

ts_control = "0.4"
ts_derp = "0.4"
ts_keys = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
futures-util = "0.3"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# WireGuard's TUN driver. Loaded from wintun.dll at runtime, so nothing is linked in.
wintun = "0.5"

[dev-dependencies]
webpki-roots = "1"
tracing-subscriber = { workspace = true }
