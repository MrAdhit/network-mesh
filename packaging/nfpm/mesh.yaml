# deb and rpm for the node: meshd, meshctl and the systemd unit.
#
# Built with nfpm rather than cargo-deb because the binaries come from the cross-compiled build
# matrix rather than from a cargo invocation on this machine, and one config producing both
# formats beats two that can disagree.
#
#   VERSION=0.1.0 ARCH=amd64 STAGE=dist/pkg/amd64 nfpm pkg -f packaging/nfpm/mesh.yaml -p deb
name: mesh
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: MrAdhit <adhityarimba97@gmail.com>
description: |
  Multipath mesh client that owns its own addressing.
  Races a direct peer-to-peer path, Cloudflare Mesh and Tailscale DERP, and carries traffic
  over whichever is fastest to each peer right now.
vendor: mesh
homepage: https://github.com/MrAdhit/network-mesh
license: MIT

contents:
  - src: ${STAGE}/meshd
    dst: /usr/bin/meshd
  - src: ${STAGE}/meshctl
    dst: /usr/bin/meshctl
  - src: ./packaging/meshd.service
    dst: /lib/systemd/system/meshd.service
  # Never overwritten on upgrade: it is where the operator put their settings.
  - src: ./packaging/meshd.env
    dst: /etc/mesh/meshd.env
    type: config|noreplace
  # The same teardown the one-liner uses, so removing the package and running the script by hand
  # cannot leave different things behind.
  - src: ./packaging/uninstall.sh
    dst: /usr/lib/mesh/uninstall.sh
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/nfpm/mesh-postinstall.sh
  preremove: ./packaging/nfpm/mesh-preremove.sh
  postremove: ./packaging/nfpm/mesh-postremove.sh

deb:
  fields:
    Bugs: https://github.com/MrAdhit/network-mesh/issues
