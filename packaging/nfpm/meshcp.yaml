# deb and rpm for the control plane. Linux only, deliberately: it is a server.
#
#   VERSION=0.1.0 ARCH=amd64 STAGE=dist/pkg/cp-amd64 nfpm pkg -f packaging/nfpm/meshcp.yaml -p deb
name: meshcp
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: MrAdhit <adhityarimba97@gmail.com>
description: |
  Control plane for the mesh: accounts, subnets, node enrollment and backhaul credentials.
  Also serves the binaries its nodes keep themselves current from.
vendor: mesh
homepage: https://github.com/MrAdhit/network-mesh
license: MIT

contents:
  - src: ${STAGE}/meshcp
    dst: /usr/bin/meshcp
  - src: ./packaging/meshcp.service
    dst: /lib/systemd/system/meshcp.service
  # Holds MESH_CP_SECRET, which the postinstall fills in once. Replacing it on upgrade would
  # make every stored backhaul credential unreadable.
  - src: ./packaging/meshcp.env
    dst: /etc/meshcp/meshcp.env
    type: config|noreplace
    file_info:
      mode: 0600

scripts:
  postinstall: ./packaging/nfpm/meshcp-postinstall.sh
  preremove: ./packaging/nfpm/meshcp-preremove.sh

deb:
  fields:
    Bugs: https://github.com/MrAdhit/network-mesh/issues
