# Link the Visual C++ runtime statically on Windows.
#
# Rust's MSVC targets link it dynamically by default, so the binaries need the VC++
# redistributable installed and fail with STATUS_DLL_NOT_FOUND (0xC0000135) on a machine
# without it. That is a silent failure: no output, no message, just an exit code. A mesh node
# should be a file you copy onto a machine and run, so the runtime goes inside it.
#
# wintun.dll is still required separately; it carries the kernel driver and cannot be linked.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
